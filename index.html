<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photo Challenge - HMJTK POLBAN X HIMAVO LIKISTA IPB</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); color: #fff; min-height: 100vh; padding-bottom: 40px; }
    header { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.15); padding: 12px 16px; position: sticky; top: 0; z-index: 50; }
    .header-container { max-w: 480px; margin: 0 auto; display: flex; justify-content: space-between; items-center; }
    .badge { background: rgba(99, 102, 241, 0.3); color: #a5b4fc; border: 1px solid rgba(129, 140, 248, 0.3); font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 10px; display: inline-block; }
    .title { font-size: 13px; font-weight: 800; margin-top: 2px; }
    .btn-juri { background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
    
    main { max-width: 480px; margin: 0 auto; padding: 16px; }
    .card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    
    .nav-toggle { display: flex; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 12px; margin-bottom: 16px; }
    .nav-btn { flex: 1; padding: 8px; text-align: center; border: none; background: transparent; color: #ccc; font-weight: bold; font-size: 12px; border-radius: 8px; cursor: pointer; }
    .nav-btn.active { background: #3b82f6; color: white; }

    label { display: block; font-size: 12px; font-weight: bold; color: #e2e8f0; margin-bottom: 6px; }
    input[type="text"], input[type="number"], input[type="password"], select { width: 100%; background: #0f172a; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
    
    .btn-primary { width: 100%; background: linear-gradient(to right, #10b981, #0d9488); border: none; color: white; font-weight: bold; padding: 12px; border-radius: 10px; font-size: 14px; cursor: pointer; }
    .btn-action { width: 100%; background: linear-gradient(to right, #6366f1, #3b82f6); border: none; color: white; font-weight: bold; padding: 10px; border-radius: 10px; font-size: 13px; cursor: pointer; margin-top: 8px; }
    .btn-amber { width: 100%; background: #f59e0b; border: none; color: #000; font-weight: bold; padding: 10px; border-radius: 10px; font-size: 13px; cursor: pointer; }

    .hidden { display: none !important; }
    .img-preview { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); margin-bottom: 8px; }
    
    /* Modal */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal-content { background: #1e1b4b; border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; padding: 20px; width: 100%; max-width: 320px; text-align: center; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-container">
      <div>
        <span class="badge">STUDI BANDING 2026</span>
        <div class="title">HMJTK POLBAN <span style="color:#f59e0b">X</span> HIMAVO LIKISTA IPB</div>
      </div>
      <button class="btn-juri" onclick="openModal()">🔒 Juri</button>
    </div>
  </header>

  <main>
    <!-- NAV TAB -->
    <div id="navTabs" class="nav-toggle hidden">
      <button id="btnTabPart" class="nav-btn active" onclick="switchTab('part')">🎮 Peserta</button>
      <button id="btnTabAdmin" class="nav-btn" onclick="switchTab('admin')">🛡️ Panel Juri</button>
    </div>

    <!-- PESERTA VIEW -->
    <div id="partView">
      <div class="card" style="text-align: center;">
        <div style="font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 10px;">
          🎯 <strong>Tantangan Pose</strong>
        </div>
        <div id="noChallenge" style="font-size: 12px; color: #94a3b8; padding: 20px 0;">
          ⏳ Juri belum memasukkan contoh pose.<br>Minta Juri login untuk atur tantangan!
        </div>
        <div id="hasChallenge" class="hidden">
          <img id="refImg" class="img-preview" src="">
          <h3 id="refTitle" style="color: #f59e0b; font-size: 14px;"></h3>
          <p id="refDesc" style="font-size: 12px; color: #cbd5e1; margin-top: 4px;"></p>
        </div>
      </div>

      <div class="card">
        <label>Pilih Kelompok:</label>
        <select id="groupSelect">
          <option value="">-- Pilih Kelompok --</option>
          <option value="Kelompok 1">Kelompok 1</option>
          <option value="Kelompok 2">Kelompok 2</option>
          <option value="Kelompok 3">Kelompok 3</option>
          <option value="Kelompok 4">Kelompok 4</option>
          <option value="Kelompok 5">Kelompok 5</option>
          <option value="Kelompok 6">Kelompok 6</option>
        </select>

        <label>Nama Pengirim / Anggota:</label>
        <input type="text" id="senderName" placeholder="Contoh: Andi & Budi">

        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;" onchange="handlePhoto(event)">
        
        <button class="btn-primary" onclick="document.getElementById('photoInput').click()">
          📸 Cekrek / Pilih Foto
        </button>

        <div id="previewBox" class="hidden" style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
          <p style="font-size: 12px; color: #34d399; margin-bottom: 8px;">✅ Foto Siap Dikirim:</p>
          <img id="photoPreview" class="img-preview" src="">
          <button class="btn-action" onclick="submitPhoto()">🚀 Kirim Foto Kelompok</button>
        </div>
      </div>
    </div>

    <!-- JURI VIEW -->
    <div id="adminView" class="hidden">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 12px;">
          <strong style="color: #f59e0b; font-size: 13px;">⚙️ Atur Tantangan Foto</strong>
          <span style="font-size: 11px; color: #f87171; cursor: pointer;" onclick="logoutAdmin()">Keluar</span>
        </div>

        <label>Judul Tantangan:</label>
        <input type="text" id="admTitle" placeholder="Contoh: Pose Paling Lucu">

        <label>Instruksi:</label>
        <input type="text" id="admDesc" placeholder="Contoh: Semua muka harus heboh">

        <label>Foto Contoh Pose:</label>
        <input type="file" id="admFile" accept="image/*" style="margin-bottom: 12px;">

        <button class="btn-amber" onclick="saveChallenge()">💾 Simpan Tantangan</button>
      </div>

      <div class="card">
        <strong style="color: #f59e0b; font-size: 13px; display: block; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 12px;">
          🏆 Papan Skor Pemenang
        </strong>
        <div id="leaderboardList" style="font-size: 12px;"></div>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 12px;">
          <strong style="font-size: 13px;">🖼️ Foto Masuk</strong>
          <button onclick="clearData()" style="background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer;">Reset Data</button>
        </div>
        <div id="galleryList"></div>
      </div>
    </div>
  </main>

  <!-- MODAL LOGIN JURI -->
  <div id="loginModal" class="modal hidden">
    <div class="modal-content">
      <h3 style="margin-bottom: 8px;">Akses Juri / Admin</h3>
      <p style="font-size: 11px; color: #cbd5e1; margin-bottom: 12px;">Masukkan PIN Admin</p>
      <input type="password" id="pinInput" placeholder="PIN (Default: 1234)">
      <div style="display: flex; gap: 8px;">
        <button style="flex:1; background: rgba(255,255,255,0.1); border:none; color:white; padding: 8px; border-radius: 8px;" onclick="closeModal()">Batal</button>
        <button style="flex:1; background: #f59e0b; border:none; color:black; font-weight:bold; padding: 8px; border-radius: 8px;" onclick="checkPin()">Masuk</button>
      </div>
    </div>
  </div>

  <script>
    let photoBase64 = null;
    let isAdmin = false;

    window.onload = function() {
      loadChallenge();
      renderGallery();
      renderLeaderboard();
    };

    function openModal() {
      if(isAdmin) { switchTab('admin'); return; }
      document.getElementById('loginModal').classList.remove('hidden');
    }
    function closeModal() { document.getElementById('loginModal').classList.add('hidden'); }
    
    function checkPin() {
      if(document.getElementById('pinInput').value === '1234') {
        isAdmin = true;
        closeModal();
        document.getElementById('navTabs').classList.remove('hidden');
        switchTab('admin');
      } else {
        alert('PIN Salah! PIN Bawaan: 1234');
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      document.getElementById('navTabs').classList.add('hidden');
      switchTab('part');
    }

    function switchTab(tab) {
      if(tab === 'admin' && !isAdmin) return;
      document.getElementById('partView').classList.toggle('hidden', tab === 'admin');
      document.getElementById('adminView').classList.toggle('hidden', tab === 'part');
      document.getElementById('btnTabPart').classList.toggle('active', tab === 'part');
      document.getElementById('btnTabAdmin').classList.toggle('active', tab === 'admin');
      if(tab === 'admin') { renderGallery(); renderLeaderboard(); }
    }

    function handlePhoto(e) {
      const file = e.target.files[0];
      if(file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          photoBase64 = evt.target.result;
          document.getElementById('photoPreview').src = photoBase64;
          document.getElementById('previewBox').classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

    function submitPhoto() {
      const grp = document.getElementById('groupSelect').value;
      const snd = document.getElementById('senderName').value;
      if(!grp || !snd) { alert('Pilih kelompok & isi nama pengirim!'); return; }
      
      const subs = JSON.parse(localStorage.getItem('sb_subs') || '[]');
      subs.unshift({ id: Date.now(), group: grp, sender: snd, photo: photoBase64, score: 0 });
      localStorage.setItem('sb_subs', JSON.stringify(subs));
      
      alert('🎉 Foto berhasil terkirim!');
      document.getElementById('previewBox').classList.add('hidden');
      document.getElementById('groupSelect').value = '';
      document.getElementById('senderName').value = '';
    }

    function saveChallenge() {
      const title = document.getElementById('admTitle').value;
      const desc = document.getElementById('admDesc').value;
      const file = document.getElementById('admFile').files[0];

      if(!title) { alert('Isi judul tantangan!'); return; }

      const save = (img) => {
        const data = { title, desc, img: img || (JSON.parse(localStorage.getItem('sb_ch')||'{}').img||'') };
        localStorage.setItem('sb_ch', JSON.stringify(data));
        alert('Tantangan disimpan!');
        loadChallenge();
      };

      if(file) {
        const r = new FileReader();
        r.onload = (e) => save(e.target.result);
        r.readAsDataURL(file);
      } else save(null);
    }

    function loadChallenge() {
      const ch = JSON.parse(localStorage.getItem('sb_ch') || 'null');
      if(ch) {
        document.getElementById('noChallenge').classList.add('hidden');
        document.getElementById('hasChallenge').classList.remove('hidden');
        document.getElementById('refTitle').innerText = ch.title;
        document.getElementById('refDesc').innerText = ch.desc;
        if(ch.img) document.getElementById('refImg').src = ch.img;
      }
    }

    function renderGallery() {
      const subs = JSON.parse(localStorage.getItem('sb_subs') || '[]');
      const container = document.getElementById('galleryList');
      container.innerHTML = subs.length === 0 ? '<p style="text-align:center; font-size:11px; color:#aaa;">Belum ada foto masuk</p>' : '';

      subs.forEach(s => {
        const item = document.createElement('div');
        item.style.cssText = 'background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; margin-bottom: 10px;';
        item.innerHTML = `
          <div style="font-size:12px; font-weight:bold; color:#f59e0b;">${s.group} <span style="color:#fff; font-weight:normal;">(${s.sender})</span></div>
          <img src="${s.photo}" class="img-preview" style="margin: 8px 0;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:11px;">Nilai:</span>
            <div>
              ${[1,2,3,4,5].map(st => `<span onclick="rate(${s.id}, ${st})" style="cursor:pointer; font-size:16px; color:${st <= s.score ? '#f59e0b':'#555'};">★</span>`).join('')}
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function rate(id, score) {
      let subs = JSON.parse(localStorage.getItem('sb_subs') || '[]');
      subs = subs.map(s => s.id === id ? {...s, score} : s);
      localStorage.setItem('sb_subs', JSON.stringify(subs));
      renderGallery();
      renderLeaderboard();
    }

    function renderLeaderboard() {
      const subs = JSON.parse(localStorage.getItem('sb_subs') || '[]');
      const scores = {};
      subs.forEach(s => { if(!scores[s.group] || s.score > scores[s.group]) scores[s.group] = s.score; });
      const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
      
      const container = document.getElementById('leaderboardList');
      container.innerHTML = sorted.length === 0 ? 'Belum ada penilaian' : '';
      sorted.forEach(([g, sc], i) => {
        container.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:6px;"><span>${i+1}. ${g}</span><span style="color:#f59e0b;">★ ${sc}</span></div>`;
      });
    }

    function clearData() {
      if(confirm('Hapus semua foto?')) {
        localStorage.removeItem('sb_subs');
        renderGallery();
        renderLeaderboard();
      }
    }
  </script>
</body>
</html>
